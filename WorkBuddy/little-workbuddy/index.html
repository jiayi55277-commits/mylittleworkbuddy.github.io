<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#8f6fc9" />
  <meta name="color-scheme" content="light" />

  <!-- PWA: Web App Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- PWA: iOS 添加到主屏幕 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="WorkBuddy" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="WorkBuddy" />

  <!-- 图标：主屏幕 / 浏览器标签 / 苹果 -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />

  <!-- 启动画面背景（iOS 在未生成截图时使用） -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Open Graph / 微信分享（让分享卡片更可爱一点） -->
  <meta property="og:title" content="My Little WorkBuddy 🌷" />
  <meta property="og:description" content="你的数字小桌面：待办、日程、专注、AI 助手与目标旅程。" />
  <meta property="og:image" content="icons/icon-512.png" />

  <title>My Little WorkBuddy 🌷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* 启动画面（防止白屏闪烁） */
    html, body { background: #f7f3fb; }
    .app-loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #d4c5f9 0%, #c9a0dc 50%, #8f6fc9 100%);
      z-index: 9999;
      transition: opacity .35s ease;
      -webkit-transition: opacity .35s ease;
    }
    .app-loading.is-hidden { opacity: 0; pointer-events: none; }
    .app-loading__inner { text-align: center; color: #fff; }
    .app-loading__icon { font-size: 64px; line-height: 1; margin-bottom: 12px; animation: appLoadingPulse 1.6s ease-in-out infinite; }
    .app-loading__title { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .04em; }
    @keyframes appLoadingPulse {
      0%, 100% { transform: scale(1); opacity: .92; }
      50% { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- 启动画面（启动后立即隐藏） -->
  <div class="app-loading" id="app-loading" aria-hidden="true">
    <div class="app-loading__inner">
      <div class="app-loading__icon">🌷</div>
      <div class="app-loading__title">My Little WorkBuddy</div>
    </div>
  </div>

  <div class="app">
    <!-- 侧边栏（桌面端） -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__brand-title">🌷 My Little WorkBuddy</span>
        <span class="sidebar__brand-sub">我的数字小桌面</span>
      </div>
      <nav id="nav-main" class="sidebar__nav"></nav>
      <div class="sidebar__foot">
        Small steps still count. 🌱<br />
        一点一点，慢慢变好。
      </div>
    </aside>

    <!-- 顶部栏（移动端） -->
    <div class="topbar">
      <span class="topbar__brand">🌷 My Little WorkBuddy</span>
      <button class="topbar__menu-btn" id="menu-btn" aria-label="更多">☰</button>
    </div>

    <!-- 主内容 -->
    <main class="main">
      <div class="content">
        <div id="view-container"></div>
        <footer class="page-footer">"Small steps still count. 🌱"</footer>
      </div>
    </main>
  </div>

  <!-- 底部导航（移动端 — 5 个主 tab + “更多”入口） -->
  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tabbar__btn" data-tab="dashboard" aria-label="首页">
      <span class="tabbar__icon">🏠</span>
      <span class="tabbar__label">首页</span>
    </button>
    <button class="tabbar__btn" data-tab="todo" aria-label="待办">
      <span class="tabbar__icon">✅</span>
      <span class="tabbar__label">待办</span>
    </button>
    <button class="tabbar__btn" data-tab="buddyai" aria-label="AI">
      <span class="tabbar__icon">🌷</span>
      <span class="tabbar__label">AI</span>
    </button>
    <button class="tabbar__btn" data-tab="timer" aria-label="专注">
      <span class="tabbar__icon">⏱️</span>
      <span class="tabbar__label">专注</span>
    </button>
    <button class="tabbar__btn" data-tab="more" id="tabbar-more" aria-label="更多">
      <span class="tabbar__icon">🗂️</span>
      <span class="tabbar__label">更多</span>
    </button>
  </nav>

  <!-- “更多”面板（移动端，列全部 13 个视图） -->
  <div class="more-sheet" id="more-sheet" hidden aria-modal="true" role="dialog" aria-label="所有视图">
    <div class="more-sheet__scrim" id="more-scrim"></div>
    <div class="more-sheet__panel">
      <div class="more-sheet__handle"></div>
      <div class="more-sheet__head">
        <span class="more-sheet__title">所有视图</span>
        <button class="more-sheet__close" id="more-close" aria-label="关闭">✕</button>
      </div>
      <div class="more-sheet__grid" id="more-grid"></div>
      <div class="more-sheet__foot">
        <span>提示：把 WorkBuddy 添加到主屏幕，体验更像原生 App ✨</span>
      </div>
    </div>
  </div>

  <!-- 全局浮层：toast 与彩屑 -->
  <div class="confetti-host" id="confetti-host"></div>
  <div class="toast-host" id="toast-host"></div>

  <!-- 脚本：顺序很重要，先存储层 → 各 view → 主程序 -->
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/todo.js"></script>
  <script src="js/views/schedule.js"></script>
  <script src="js/views/timer.js"></script>
  <script src="js/views/learning.js"></script>
  <script src="js/views/habit.js"></script>
  <script src="js/views/mood.js"></script>
  <script src="js/views/notes.js"></script>
  <script src="js/views/wins.js"></script>
  <script src="js/views/buddyai.js"></script>
  <script src="js/views/food.js"></script>
  <script src="js/views/goals.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/app.js"></script>

  <script>
    /* 隐藏启动画面 + 注册 Service Worker（不阻塞 UI） */
    (function () {
      function hideLoading() {
        var el = document.getElementById('app-loading');
        if (el) {
          el.classList.add('is-hidden');
          setTimeout(function () { el.remove(); }, 380);
        }
      }
      if (document.readyState === 'complete') hideLoading();
      else window.addEventListener('load', hideLoading);

      if ('serviceWorker' in navigator) {
        // Use relative scope so SW covers the whole app folder.
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          console.log('[pwa] service worker registered, scope:', reg.scope);
        }).catch(function (err) {
          console.warn('[pwa] service worker failed:', err);
        });
      }
    })();
  </script>
</body>
</html>
